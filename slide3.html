<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Agentic PM - Slide 2</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="navbar.js"></script>
    <style>
        /* Scoped to slide2a: floating "from distance" questions */
        .slide-content { position: relative; overflow: hidden; }

        .wnai-title { position: relative; z-index: 2; font-size: 7rem !important; }

        .floating-questions {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .floating-q {
            position: absolute;
            font-size: 1.4375rem;
            color: var(--text-secondary);
            white-space: nowrap;
            opacity: 0;
            transform-origin: center;
            animation: floatFromDistance 14s ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }

        .fq-1 { top: 22%;    left: 10%;  --fromX:  35vw; --fromY:  22vh; --delay: 0s; }
        .fq-2 { top: 26%;    right: 8%;  --fromX: -34vw; --fromY:  20vh; --delay: 2.8s; }
        .fq-3 { bottom: 24%; left: 12%;  --fromX:  32vw; --fromY: -22vh; --delay: 5.6s; }
        .fq-4 { bottom: 26%; right: 10%; --fromX: -32vw; --fromY: -20vh; --delay: 8.4s; }
        .fq-5 { bottom: 8%;  left: 38%;  --fromX:   0vw; --fromY: -30vh; --delay: 11.2s; }

        @keyframes floatFromDistance {
            0%   { transform: translate(var(--fromX), var(--fromY)) scale(0.05); opacity: 0; }
            15%  { opacity: 1; }
            50%  { transform: translate(0, 0) scale(1); opacity: 1; }
            85%  { opacity: 1; transform: translate(calc(var(--fromX) * -0.25), calc(var(--fromY) * -0.25)) scale(1.05); }
            100% { transform: translate(calc(var(--fromX) * -0.55), calc(var(--fromY) * -0.55)) scale(1.1); opacity: 0; }
        }

        @media (max-width: 768px) {
            .floating-q { font-size: 1.1875rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-q { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    
    <div class="slide active">
        
        <div class="slide-content">
            <!-- ========================================
                 CONTENT AREA - Replace this section
                 ======================================== -->
            
            <h1 class="mb-3 wave-text wnai-title">Why we need AI?</h1>

            <div class="floating-questions" aria-hidden="true">
                <span class="floating-q fq-1">Work smarter, not harder?</span>
                <span class="floating-q fq-2">More time with family and friends?</span>
                <span class="floating-q fq-3">Make better decisions, faster?</span>
                <span class="floating-q fq-4">Need a tireless teammate?</span>
                <span class="floating-q fq-5">Spend more time strategizing?</span>
            </div>

        </div>
        <div class="nav-controls">
            <button class="btn btn-custom" id="prev-btn">
                <i class="bi bi-arrow-left"></i> Previous
            </button>
            <span class="slide-indicator">1</span>
            <button class="btn btn-custom" id="next-btn">
                Next <i class="bi bi-arrow-right"></i>
            </button>
        </div>
        
        <div class="watermark">@ravikprasad</div>
    </div>

    <script src="navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Update page title from config
        document.addEventListener('DOMContentLoaded', () => {
            if (window.presentationConfig) {
                const slideNumber = document.querySelector('.slide-indicator').textContent.split('/')[0].trim();
                document.getElementById('page-title').textContent = 
                    `${window.presentationConfig.event.name} - Slide ${slideNumber}`;
            }
        });
    </script>
</body>
</html>
